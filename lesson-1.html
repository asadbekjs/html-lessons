<!doctype html>
<html>
  <head>
    <title>HTML Lesson 1</title>
  </head>
  <body>
    <a href="./links.html">Links sahifasiga o'tish</a>
    <!-- HTML da yozilgan izohlarni browser o'qimaydi -->
    <!-- Headings(Sarlavhalar) -->
    <h1>Eng katta sarlavha 1</h1>
    <h2>2-darajali sarlavha</h2>
    <h3>3-darajali sarlavha</h3>
    <!-- <h4>4-darajali sarlavha</h4> -->
    <h5>5-darajali sarlavha</h5>
    <h6>6-darajali sarlavha</h6>
    <!-- Paragraphs(Paragraflar) -->
    <p>Lorem ipsum dolor sit amet</p>
    <!-- HTML Element = opening tag + Content + closing tag -->
    <p>Lorem ipsum dolor sit amet 2222</p>
    <!-- Image -->
    <!-- src = source, alt = alternative -->
    <img
      src="https://publish.realmadrid.com/content/dam/portals/realmadrid-com/es-es/sports/football/legendary-players/cristiano-ronaldo-dos-santos-aveiro/assets/1330603286208.jpg"
      alt="CR7"
      width="200"
      height="200"
    />
    <!-- AXV Logo -->
    <img src="./images/image.png" alt="AXV Logo" />
    <!-- MrBeast Photo -->
    <img src="./images/mrbeast.png" alt="MrBeast photo" />
  </body>
</html>
