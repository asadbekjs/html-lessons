<!doctype html>
<html>
  <head>
    <title>HTML Table</title>
    <style>
      table {
        border-collapse: collapse;
        width: 100%;
      }
      th,
      td {
        border: 1px solid black;
      }
      img {
        height: 80px;
      }
    </style>
  </head>
  <body>
    <table>
      <thead>
        <tr>
          <th>No.</th>
          <th>Full Name</th>
          <th>Position</th>
          <th>Salary</th>
          <th>Image</th>
          <th>Website</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>1</td>
          <td>Bill Gates</td>
          <td>founder microsoft</td>
          <td>1000$</td>
          <td>
            <img
              src="https://upload.wikimedia.org/wikipedia/commons/d/d9/Bill_Gates_at_the_European_Commission_-_P067383-987995_%28cropped%29_5.jpg?utm_source=en.wikipedia.org&utm_campaign=index&utm_content=original"
              alt="Bill Gates"
            />
          </td>
          <td>
            <a href="https://www.microsoft.com/" target="_blank"
              >Microsoft official website</a
            >
          </td>
        </tr>
        <tr>
          <td>2</td>
          <td>Stev Jobs</td>
          <td>founder apple</td>
          <td>1200$</td>
        </tr>
        <tr>
          <td>3</td>
          <td>larry page</td>
          <td>founder google</td>
          <td>1100$</td>
        </tr>
        <tr>
          <td>4.</td>
          <td>Mark Zuckeberg</td>
          <td>founder facebook</td>
          <td>1300$</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
